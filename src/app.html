<!doctype html>
<html lang="es" class="light">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
        <!-- Manifest del PWA. SIN esto, Android Chrome no ofrece instalar ("No se
             puede instalar"); iOS sí instala por las meta de Apple de abajo. El
             archivo lo genera vite-plugin-pwa en la raíz del build. -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
        />
        <meta name="theme-color" content="#1e7df0" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="app-shell">%sveltekit.body%</div>
    </body>
</html>
